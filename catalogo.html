<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo — AIROX</title>
<meta name="description" content="Catálogo completo de AIROX: AirPods, JBL, smartwatches, lentes inteligentes, gaming, Alexa, accesorios, streaming y más.">
<link rel="icon" href="images/brand/favicon.jpg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<section id="catalog-top">
  <h2 class="section-title">Catálogo Airox</h2>
  <p class="section-sub">Filtra por categoría o busca el producto que necesitas</p>

  <div class="search-box">
    <input type="text" id="search" placeholder="Buscar producto...">
  </div>

  <p class="search-info" id="search-info"></p>
  <div class="filters" id="filters"></div>

  <div class="product-grid" id="grid"></div>

  <p class="disclaimer">Precios y stock referenciales, sujetos a confirmación por WhatsApp según disponibilidad.</p>
</section>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/legal-content.js"></script>
<script src="js/main.js"></script>
<script src="js/cart.js"></script>
<script src="js/components.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const initialCat = params.get("cat") || "all";
  const initialSearch = params.get("search") || "";
  document.addEventListener("DOMContentLoaded", () => {
    renderLayout("catalogo");
    renderCatalog({ gridId: "grid", filterId: "filters", searchId: "search", initialCategory: initialCat, initialSearch });
    if (initialSearch || params.get("cat")) document.getElementById("catalog-top").scrollIntoView();
  });
</script>
</body>
</html>
